<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Age of Attraction DTR</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 24px 20px 50px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    h2 {
      margin: 0 0 25px;
      font-size: 18px;
      font-weight: normal;
      color: #aaa;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-size: 14px;
      color: #ccc;
    }

    input, select, textarea {
      width: 100%;
      padding: 13px;
      border-radius: 7px;
      border: 1px solid #555;
      background: #333;
      color: white;
      font-size: 16px;
    }

    select {
      background: #444;
      border-color: #666;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #aaa;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: none;
      border-radius: 7px;
      background: white;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #333;
      color: white;
      border: 1px solid #555;
    }

    .subtitle {
      color: #888;
      margin-bottom: 25px;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 7px;
      background: #222;
      color: #ddd;
      display: none;
    }

    .message.success {
      display: block;
      background: #18351f;
      color: #a8e6b4;
    }

    .message.error {
      display: block;
      background: #3a1818;
      color: #ffb0b0;
    }

    .hidden {
      display: none !important;
    }

    .time-help {
      margin-top: 6px;
      font-size: 13px;
      color: #888;
    }

    .hours-preview {
      margin-top: 20px;
      padding: 15px;
      background: #1d1d1d;
      border: 1px solid #333;
      border-radius: 7px;
      text-align: center;
    }

    .hours-number {
      font-size: 22px;
      font-weight: bold;
    }

    .hours-detail {
      margin-top: 5px;
      font-size: 13px;
      color: #999;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 25px;
    }

    .top-bar button {
      width: auto;
      margin: 0;
      padding: 8px 12px;
      font-size: 13px;
    }

    .section {
      margin-top: 30px;
      padding-top: 5px;
      border-top: 1px solid #333;
    }

    .section-title {
      margin-top: 20px;
      margin-bottom: 0;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->

  <div id="loginScreen">

    <h1>Age of Attraction</h1>
    <h2>Season 2 · Sound Department</h2>

    <label>Email</label>
    <input type="email" id="email" autocomplete="email">

    <label>Password</label>
    <input type="password" id="password" autocomplete="current-password">

    <button onclick="signIn()">Log In</button>
    <button class="secondary" onclick="signUp()">Create Account</button>

    <div id="loginMessage" class="message"></div>

  </div>


  <!-- CREW SETUP -->

  <div id="setupScreen" class="hidden">

    <h1>Crew Setup</h1>

    <div class="subtitle">
      Enter your production and payroll information.
    </div>

    <label>Name</label>
    <input type="text" id="crewName">

    <label>Department</label>
    <input type="text" value="Sound" disabled>

    <label>Position</label>

    <select id="position">
      <option value="">Select position</option>
      <option value="HOD">HOD</option>
      <option value="A1">A1</option>
      <option value="A2">A2</option>
      <option value="Bag Mixer">Bag Mixer</option>
    </select>


    <label>Employee Type</label>

    <select id="employmentType" onchange="updateEmploymentFields()">
      <option value="">Select type</option>
      <option value="Employee">Employee</option>
      <option value="Incorporated Contractor">
        Incorporated Contractor
      </option>
    </select>


    <div id="corporationFields" class="hidden section">

      <div class="section-title">
        Corporation Information
      </div>

      <label>Corporation Name</label>
      <input type="text" id="corporationName">

      <label>GST #</label>
      <input type="text" id="gstNumber">

      <label>GST Amount</label>
      <input
        type="number"
        id="gstAmount"
        min="0"
        step="0.01"
        inputmode="decimal"
      >

    </div>


    <div class="section">

      <div class="section-title">
        Rate & Kit
      </div>

      <label>Day Rate</label>

      <input
        type="number"
        id="dayRate"
        min="0"
        step="0.01"
        inputmode="decimal"
      >


      <label>Additional Fee</label>

      <select id="feeType">
        <option value="None">None</option>
        <option value="Kit">Kit Fee</option>
        <option value="Vehicle">Vehicle Fee</option>
      </select>


      <label>Fee Amount</label>

      <input
        type="number"
        id="kitRental"
        min="0"
        step="0.01"
        inputmode="decimal"
        value="0"
      >


      <label>Kit / Equipment Notes</label>

      <textarea
        id="equipmentNotes"
        placeholder="Optional"
      ></textarea>

    </div>


    <div class="section">

      <div class="section-title">
        Production Information
      </div>

      <label>Local / Hotel</label>

      <select id="localHotel">
        <option value="">Select</option>
        <option value="Local">Local</option>
        <option value="Hotel">Hotel</option>
      </select>


      <label>Province</label>

      <select id="province">
        <option value="">Select province</option>
        <option value="BC">BC</option>
        <option value="ON">ON</option>
      </select>


      <label>Crew Initials</label>

      <input
        type="text"
        id="crewInitials"
        maxlength="5"
        placeholder="e.g. JZ"
      >

    </div>


    <button onclick="saveProfile()">
      Save Profile
    </button>

    <div id="setupMessage" class="message"></div>

  </div>


  <!-- DAILY DTR -->

  <div id="dtrScreen" class="hidden">

    <div class="top-bar">

      <div>
        <h1>Daily DTR</h1>
        <div class="subtitle" id="crewGreeting"></div>
      </div>

      <button
        class="secondary"
        onclick="signOut()"
      >
        Log Out
      </button>

    </div>


    <label>Date</label>
    <input type="date" id="dtrDate">


    <label>IN</label>

    <input
      type="text"
      id="startTime"
      placeholder="08:00"
      inputmode="numeric"
      maxlength="5"
      autocomplete="off"
    >

    <div class="time-help">
      24-hour format
    </div>


    <label>Lunch Start</label>

    <input
      type="text"
      id="lunchStart"
      placeholder="13:00"
      inputmode="numeric"
      maxlength="5"
      autocomplete="off"
    >


    <label>Lunch End</label>

    <input
      type="text"
      id="lunchEnd"
      placeholder="13:30"
      inputmode="numeric"
      maxlength="5"
      autocomplete="off"
    >


    <label>OUT</label>

    <input
      type="text"
      id="endTime"
      placeholder="26:30"
      inputmode="numeric"
      maxlength="5"
      autocomplete="off"
    >

    <div class="time-help">
      For after-midnight finishes use 25:00, 26:30, etc. Maximum 48:00.
    </div>


    <div
      id="hoursPreview"
      class="hours-preview hidden"
    >

      <div
        id="hoursNumber"
        class="hours-number"
      ></div>

      <div
        id="hoursDetail"
        class="hours-detail"
      ></div>

    </div>


    <label>Notes</label>

    <textarea
      id="dtrNotes"
      placeholder="Optional notes about the day"
    ></textarea>


    <button onclick="submitDTR()">
      Submit DTR
    </button>

    <div id="dtrMessage" class="message"></div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://hyhzcikkoqvvfyiffmla.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Gl1oRE_S8bRTiI65vCnHRQ_InR0_wX1";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentUser = null;
let currentProfile = null;
let productionId = null;



function showScreen(screenId) {

  document
    .getElementById("loginScreen")
    .classList.add("hidden");

  document
    .getElementById("setupScreen")
    .classList.add("hidden");

  document
    .getElementById("dtrScreen")
    .classList.add("hidden");

  document
    .getElementById(screenId)
    .classList.remove("hidden");
}



function showMessage(elementId, message, type) {

  const element =
    document.getElementById(elementId);

  element.textContent = message;

  element.className =
    "message " + type;
}



function todayString() {

  const now = new Date();

  const year =
    now.getFullYear();

  const month =
    String(now.getMonth() + 1)
      .padStart(2, "0");

  const day =
    String(now.getDate())
      .padStart(2, "0");

  return `${year}-${month}-${day}`;
}



function parseTimeToMinutes(value) {

  value = value.trim();

  const match =
    value.match(/^(\d{1,2}):([0-5]\d)$/);

  if (!match) {
    return null;
  }

  const hours =
    parseInt(match[1], 10);

  const minutes =
    parseInt(match[2], 10);

  if (hours < 0 || hours > 48) {
    return null;
  }

  if (hours === 48 && minutes > 0) {
    return null;
  }

  return (hours * 60) + minutes;
}



function minutesToDisplay(minutes) {

  const hours =
    Math.floor(minutes / 60);

  const mins =
    minutes % 60;

  if (mins === 0) {
    return `${hours}h`;
  }

  return `${hours}h ${mins}m`;
}



function updateEmploymentFields() {

  const type =
    document.getElementById(
      "employmentType"
    ).value;

  const fields =
    document.getElementById(
      "corporationFields"
    );

  if (type === "Incorporated Contractor") {

    fields.classList.remove("hidden");

  } else {

    fields.classList.add("hidden");

  }
}



function updateHoursPreview() {

  const start =
    parseTimeToMinutes(
      document.getElementById(
        "startTime"
      ).value
    );

  const lunchStart =
    parseTimeToMinutes(
      document.getElementById(
        "lunchStart"
      ).value
    );

  const lunchEnd =
    parseTimeToMinutes(
      document.getElementById(
        "lunchEnd"
      ).value
    );

  const end =
    parseTimeToMinutes(
      document.getElementById(
        "endTime"
      ).value
    );


  const preview =
    document.getElementById(
      "hoursPreview"
    );


  if (
    start === null ||
    lunchStart === null ||
    lunchEnd === null ||
    end === null
  ) {

    preview.classList.add("hidden");

    return;
  }


  if (
    lunchStart < start ||
    lunchEnd <= lunchStart ||
    end <= lunchEnd
  ) {

    preview.classList.add("hidden");

    return;
  }


  const lunchMinutes =
    lunchEnd - lunchStart;

  const totalMinutes =
    end - start - lunchMinutes;


  document.getElementById(
    "hoursNumber"
  ).textContent =
    "Total: " +
    minutesToDisplay(totalMinutes);


  document.getElementById(
    "hoursDetail"
  ).textContent =
    "Lunch: " +
    minutesToDisplay(lunchMinutes);


  preview.classList.remove("hidden");
}



[
  "startTime",
  "lunchStart",
  "lunchEnd",
  "endTime"
].forEach(id => {

  document
    .getElementById(id)
    .addEventListener(
      "input",
      updateHoursPreview
    );

});



async function initialize() {

  const {
    data: { session }
  } =
    await supabaseClient.auth.getSession();


  if (!session) {

    showScreen("loginScreen");

    return;
  }


  currentUser =
    session.user;

  await loadProfile();
}



async function signUp() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;


  if (!email || !password) {

    showMessage(
      "loginMessage",
      "Please enter an email and password.",
      "error"
    );

    return;
  }


  const { data, error } =
    await supabaseClient.auth.signUp({
      email,
      password
    });


  if (error) {

    showMessage(
      "loginMessage",
      error.message,
      "error"
    );

    return;
  }


  currentUser =
    data.user;


  showMessage(
    "loginMessage",
    "Account created. You can now log in.",
    "success"
  );
}



async function signIn() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;


  if (!email || !password) {

    showMessage(
      "loginMessage",
      "Please enter an email and password.",
      "error"
    );

    return;
  }


  const { data, error } =
    await supabaseClient.auth
      .signInWithPassword({
        email,
        password
      });


  if (error) {

    showMessage(
      "loginMessage",
      error.message,
      "error"
    );

    return;
  }


  currentUser =
    data.user;

  await loadProfile();
}



async function loadProfile() {

  const {
    data: profiles,
    error
  } =
    await supabaseClient
      .from("crew_profiles")
      .select("*")
      .eq(
        "user_id",
        currentUser.id
      )
      .limit(1);


  if (error) {

    showMessage(
      "loginMessage",
      error.message,
      "error"
    );

    showScreen("loginScreen");

    return;
  }


  if (
    !profiles ||
    profiles.length === 0
  ) {

    await findProduction();

    showScreen("setupScreen");

    return;
  }


  currentProfile =
    profiles[0];

  productionId =
    currentProfile.production_id;


  /*
    Existing profiles were created
    before the new payroll fields existed.

    If the important new fields are
    missing, send the user back through
    setup so they can complete them.
  */

  if (
    !currentProfile.employment_type ||
    !currentProfile.local_hotel ||
    !currentProfile.province ||
    !currentProfile.crew_initials
  ) {

    populateProfileForm();

    showScreen("setupScreen");

    return;
  }


  showDTR();
}



function populateProfileForm() {

  if (!currentProfile) {
    return;
  }


  document.getElementById(
    "crewName"
  ).value =
    currentProfile.name || "";


  document.getElementById(
    "position"
  ).value =
    currentProfile.position || "";


  document.getElementById(
    "employmentType"
  ).value =
    currentProfile.employment_type || "";


  document.getElementById(
    "dayRate"
  ).value =
    currentProfile.day_rate || 0;


  document.getElementById(
    "kitRental"
  ).value =
    currentProfile.kit_rental || 0;


  document.getElementById(
    "equipmentNotes"
  ).value =
    currentProfile.equipment_notes || "";


  document.getElementById(
    "feeType"
  ).value =
    currentProfile.fee_type || "None";


  document.getElementById(
    "localHotel"
  ).value =
    currentProfile.local_hotel || "";


  document.getElementById(
    "province"
  ).value =
    currentProfile.province || "";


  document.getElementById(
    "corporationName"
  ).value =
    currentProfile.corporation_name || "";


  document.getElementById(
    "gstNumber"
  ).value =
    currentProfile.gst_number || "";


  document.getElementById(
    "gstAmount"
  ).value =
    currentProfile.gst_amount || "";


  document.getElementById(
    "crewInitials"
  ).value =
    currentProfile.crew_initials || "";


  updateEmploymentFields();
}



async function findProduction() {

  const { data, error } =
    await supabaseClient
      .from("productions")
      .select("*")
      .eq(
        "name",
        "Age of Attraction"
      )
      .eq(
        "season",
        "Season 2"
      )
      .limit(1);


  if (error) {

    showMessage(
      "setupMessage",
      "Unable to find the production: " +
        error.message,
      "error"
    );

    return;
  }


  if (!data || data.length === 0) {

    showMessage(
      "setupMessage",
      "Unable to find the production.",
      "error"
    );

    return;
  }


  productionId =
    data[0].id;
}



async function saveProfile() {

  const name =
    document
      .getElementById("crewName")
      .value
      .trim();

  const position =
    document
      .getElementById("position")
      .value;

  const employmentType =
    document
      .getElementById(
        "employmentType"
      )
      .value;

  const dayRate =
    parseFloat(
      document.getElementById(
        "dayRate"
      ).value
    ) || 0;

  const kitRental =
    parseFloat(
      document.getElementById(
        "kitRental"
      ).value
    ) || 0;

  const feeType =
    document
      .getElementById(
        "feeType"
      ).value;

  const equipmentNotes =
    document
      .getElementById(
        "equipmentNotes"
      )
      .value
      .trim();

  const localHotel =
    document
      .getElementById(
        "localHotel"
      ).value;

  const province =
    document
      .getElementById(
        "province"
      ).value;

  const crewInitials =
    document
      .getElementById(
        "crewInitials"
      )
      .value
      .trim()
      .toUpperCase();

  const corporationName =
    document
      .getElementById(
        "corporationName"
      )
      .value
      .trim();

  const gstNumber =
    document
      .getElementById(
        "gstNumber"
      )
      .value
      .trim();

  const gstAmount =
    parseFloat(
      document.getElementById(
        "gstAmount"
      ).value
    ) || 0;


  if (
    !name ||
    !position ||
    !employmentType ||
    !localHotel ||
    !province ||
    !crewInitials
  ) {

    showMessage(
      "setupMessage",
      "Please complete all required fields.",
      "error"
    );

    return;
  }


  if (
    employmentType ===
      "Incorporated Contractor" &&
    (!corporationName || !gstNumber)
  ) {

    showMessage(
      "setupMessage",
      "Please enter your corporation name and GST number.",
      "error"
    );

    return;
  }


  if (!productionId) {

    await findProduction();

    if (!productionId) {
      return;
    }
  }


  const profileData = {

    user_id:
      currentUser.id,

    production_id:
      productionId,

    name:
      name,

    position:
      position,

    employment_type:
      employmentType,

    day_rate:
      dayRate,

    kit_rental:
      kitRental,

    fee_type:
      feeType,

    equipment_notes:
      equipmentNotes,

    local_hotel:
      localHotel,

    province:
      province,

    crew_initials:
      crewInitials,

    corporation_name:
      employmentType ===
        "Incorporated Contractor"
        ? corporationName
        : null,

    gst_number:
      employmentType ===
        "Incorporated Contractor"
        ? gstNumber
        : null,

    gst_amount:
      employmentType ===
        "Incorporated Contractor"
        ? gstAmount
        : null

  };


  let result;


  if (currentProfile) {

    result =
      await supabaseClient
        .from("crew_profiles")
        .update(profileData)
        .eq(
          "id",
          currentProfile.id
        )
        .select()
        .single();

  } else {

    result =
      await supabaseClient
        .from("crew_profiles")
        .insert(profileData)
        .select()
        .single();

  }


  if (result.error) {

    showMessage(
      "setupMessage",
      result.error.message,
      "error"
    );

    return;
  }


  currentProfile =
    result.data;


  showDTR();
}



function showDTR() {

  showScreen("dtrScreen");


  document.getElementById(
    "dtrDate"
  ).value =
    todayString();


  document.getElementById(
    "crewGreeting"
  ).textContent =
    currentProfile.name +
    " · " +
    currentProfile.position;
}



async function submitDTR() {

  const date =
    document
      .getElementById(
        "dtrDate"
      ).value;

  const startValue =
    document
      .getElementById(
        "startTime"
      ).value;

  const lunchStartValue =
    document
      .getElementById(
        "lunchStart"
      ).value;

  const lunchEndValue =
    document
      .getElementById(
        "lunchEnd"
      ).value;

  const endValue =
    document
      .getElementById(
        "endTime"
      ).value;

  const notes =
    document
      .getElementById(
        "dtrNotes"
      )
      .value
      .trim();


  if (
    !date ||
    !startValue ||
    !lunchStartValue ||
    !lunchEndValue ||
    !endValue
  ) {

    showMessage(
      "dtrMessage",
      "Please complete IN, Lunch Start, Lunch End and OUT.",
      "error"
    );

    return;
  }


  const startMinutes =
    parseTimeToMinutes(startValue);

  const lunchStartMinutes =
    parseTimeToMinutes(
      lunchStartValue
    );

  const lunchEndMinutes =
    parseTimeToMinutes(
      lunchEndValue
    );

  const endMinutes =
    parseTimeToMinutes(endValue);


  if (
    startMinutes === null ||
    lunchStartMinutes === null ||
    lunchEndMinutes === null ||
    endMinutes === null
  ) {

    showMessage(
      "dtrMessage",
      "Times must use HH:MM format and be between 00:00 and 48:00.",
      "error"
    );

    return;
  }


  if (lunchStartMinutes < startMinutes) {

    showMessage(
      "dtrMessage",
      "Lunch Start cannot be before IN.",
      "error"
    );

    return;
  }


  if (
    lunchEndMinutes <=
    lunchStartMinutes
  ) {

    showMessage(
      "dtrMessage",
      "Lunch End must be later than Lunch Start.",
      "error"
    );

    return;
  }


  if (
    endMinutes <=
    lunchEndMinutes
  ) {

    showMessage(
      "dtrMessage",
      "OUT must be later than Lunch End. For after-midnight finishes, use 25:00, 26:30, etc.",
      "error"
    );

    return;
  }


  const { error } =
    await supabaseClient
      .from("dtrs")
      .upsert(
        {
          crew_profile_id:
            currentProfile.id,

          date:
            date,

          start_minutes:
            startMinutes,

          lunch_start_minutes:
            lunchStartMinutes,

          lunch_end_minutes:
            lunchEndMinutes,

          end_minutes:
            endMinutes,

          notes:
            notes,

          status:
            "submitted",

          updated_at:
            new Date().toISOString()
        },
        {
          onConflict:
            "crew_profile_id,date"
        }
      );


  if (error) {

    showMessage(
      "dtrMessage",
      error.message,
      "error"
    );

    return;
  }


  showMessage(
    "dtrMessage",
    "DTR submitted successfully.",
    "success"
  );
}



async function signOut() {

  await supabaseClient.auth.signOut();

  currentUser = null;
  currentProfile = null;
  productionId = null;

  showScreen("loginScreen");
}



initialize();

</script>
