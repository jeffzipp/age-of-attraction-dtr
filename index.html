<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginScreen">

    <h1>Age of Attraction</h1>
    <h2>Season 2 · Sound Department</h2>

    <label>Email</label>
    <input type="email" id="email" autocomplete="email">

    <label>Password</label>
    <input type="password" id="password" autocomplete="current-password">

    <button onclick="signIn()">Log In</button>
    <button class="secondary" onclick="signUp()">Create Account</button>

    <div id="loginMessage" class="message"></div>

  </div>


  <!-- CREW SETUP -->
  <div id="setupScreen" class="hidden">

    <h1>Crew Setup</h1>
    <div class="subtitle">
      Enter your information once. You can update it later.
    </div>

    <label>Name</label>
    <input type="text" id="crewName">

    <label>Position</label>
    <select id="position">
      <option value="">Select position</option>
      <option value="HOD">HOD</option>

      <option value="Bag Mixer">Bag Mixer</option>
    </select>

    <label>Day Rate</label>
    <input type="number" id="dayRate" min="0" step="0.01" inputmode="decimal">

    <label>Kit Rental</label>
    <input type="number" id="kitRental" min="0" step="0.01" inputmode="decimal">

    <label>Kit / Equipment Notes</label>
    <textarea id="equipmentNotes"
      placeholder="Optional equipment or kit details"></textarea>

    <button onclick="saveProfile()">Save Profile</button>

    <div id="setupMessage" class="message"></div>

  </div>


  <!-- DTR -->
  <div id="dtrScreen" class="hidden">

    <div class="top-bar">
      <div>
        <h1>Daily DTR</h1>
        <div class="subtitle" id="crewGreeting"></div>
      </div>

      <button class="secondary" onclick="signOut()">Log Out</button>
    </div>

    <label>Date</label>
    <input type="date" id="dtrDate">

    <label>Start Time</label>
    <input
      type="text"
      id="startTime"
      placeholder="08:00"
      inputmode="numeric"
      maxlength="5"
      autocomplete="off"
    >

    <div class="time-help">
      Use 24-hour format. Times after midnight can be entered as 25:00, 26:30, etc.
    </div>

    <label>Lunch Duration</label>
    <input
      type="number"
      id="lunchMinutes"
      min="0"
      step="5"
      value="30"
      inputmode="numeric"
    >

    <label>End Time</label>
    <input
      type="text"
      id="endTime"
      placeholder="17:00"
      inputmode="numeric"
      maxlength="5"
      autocomplete="off"
    >

    <div class="time-help">
      Maximum: 48:00
    </div>

    <div id="hoursPreview" class="hours-preview hidden"></div>

    <label>Notes</label>
    <textarea
      id="dtrNotes"
      placeholder="Optional notes about the day"
    ></textarea>

    <button onclick="submitDTR()">Submit DTR</button>

    <div id="dtrMessage" class="message"></div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL = "https://hyhzcikkoqvvfyiffmla.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_Gl1oRE_S8bRTiI65vCnHRQ_InR0_wX1";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  let currentUser = null;
  let currentProfile = null;
  let productionId = null;


  function showScreen(screenId) {

    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("setupScreen").classList.add("hidden");
    document.getElementById("dtrScreen").classList.add("hidden");

    document.getElementById(screenId).classList.remove("hidden");
  }


  function showMessage(elementId, message, type) {

    const element = document.getElementById(elementId);

    element.textContent = message;

    element.className = "message " + type;
  }


  function todayString() {

    const now = new Date();

    const year = now.getFullYear();

    const month =
      String(now.getMonth() + 1).padStart(2, "0");

    const day =
      String(now.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
  }


  function parseTimeToMinutes(value) {

    value = value.trim();

    const match =
      value.match(/^(\d{1,2}):([0-5]\d)$/);

    if (!match) {
      return null;
    }

    const hours = parseInt(match[1], 10);
    const minutes = parseInt(match[2], 10);

    if (hours < 0 || hours > 48) {
      return null;
    }

    if (hours === 48 && minutes > 0) {
      return null;
    }

    return hours * 60 + minutes;
  }


  function formatHours(minutes) {

    const hours = Math.floor(minutes / 60);

    const mins = minutes % 60;

    if (mins === 0) {
      return `${hours} hours`;
    }

    return `${hours}h ${mins}m`;
  }


  function updateHoursPreview() {

    const start =
      parseTimeToMinutes(
        document.getElementById("startTime").value
      );

    const end =
      parseTimeToMinutes(
        document.getElementById("endTime").value
      );

    const lunch =
      parseInt(
        document.getElementById("lunchMinutes").value,
        10
      ) || 0;

    const preview =
      document.getElementById("hoursPreview");

    if (
      start === null ||
      end === null ||
      end <= start
    ) {
      preview.classList.add("hidden");
      return;
    }

    const workedMinutes =
      end - start - lunch;

    if (workedMinutes < 0) {
      preview.classList.add("hidden");
      return;
    }

    preview.textContent =
      "Total: " + formatHours(workedMinutes);

    preview.classList.remove("hidden");
  }


  document
    .getElementById("startTime")
    .addEventListener("input", updateHoursPreview);

  document
    .getElementById("endTime")
    .addEventListener("input", updateHoursPreview);

  document
    .getElementById("lunchMinutes")
    .addEventListener("input", updateHoursPreview);


  async function initialize() {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();

    if (!session) {
      showScreen("loginScreen");
      return;
    }

    currentUser = session.user;

    await loadProfile();
  }


  async function signUp() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if (!email || !password) {

      showMessage(
        "loginMessage",
        "Please enter an email and password.",
        "error"
      );

      return;
    }

    const { data, error } =
      await supabaseClient.auth.signUp({
        email,
        password
      });

    if (error) {

      showMessage(
        "loginMessage",
        error.message,
        "error"
      );

      return;
    }

    currentUser = data.user;

    showMessage(
      "loginMessage",
      "Account created. You can now log in.",
      "success"
    );
  }


  async function signIn() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if (!email || !password) {

      showMessage(
        "loginMessage",
        "Please enter an email and password.",
        "error"
      );

      return;
    }

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if (error) {

      showMessage(
        "loginMessage",
        error.message,
        "error"
      );

      return;
    }

    currentUser = data.user;

    await loadProfile();
  }


  async function loadProfile() {

    const {
      data: profiles,
      error
    } =
      await supabaseClient
        .from("crew_profiles")
        .select("*")
        .eq("user_id", currentUser.id)
        .limit(1);

    if (error) {

      showMessage(
        "loginMessage",
        error.message,
        "error"
      );

      showScreen("loginScreen");

      return;
    }


    if (!profiles || profiles.length === 0) {

      await findProduction();

      showScreen("setupScreen");

      return;
    }


    currentProfile = profiles[0];

    productionId = currentProfile.production_id;

    showDTR();
  }


  async function findProduction() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("productions")
        .select("*")
        .eq("name", "Age of Attraction")
        .eq("season", "Season 2")
        .limit(1);

    if (error) {

      showMessage(
        "setupMessage",
        "Unable to find the production: " + error.message,
        "error"
      );

      return;
    }

    if (!data || data.length === 0) {

      showMessage(
        "setupMessage",
        "Unable to find the production.",
        "error"
      );

      return;
    }

    productionId = data[0].id;
  }


  async function saveProfile() {

    const name =
      document.getElementById("crewName").value.trim();

    const position =
      document.getElementById("position").value;

    const dayRate =
      parseFloat(
        document.getElementById("dayRate").value
      ) || 0;

    const kitRental =
      parseFloat(
        document.getElementById("kitRental").value
      ) || 0;

    const equipmentNotes =
      document.getElementById("equipmentNotes").value.trim();


    if (!name || !position) {

      showMessage(
        "setupMessage",
        "Please enter your name and position.",
        "error"
      );

      return;
    }


    if (!productionId) {

      await findProduction();

      if (!productionId) {
        return;
      }
    }


    const { data, error } =
      await supabaseClient
        .from("crew_profiles")
        .insert({
          user_id: currentUser.id,
          production_id: productionId,
          name,
          position,
          day_rate: dayRate,
          kit_rental: kitRental,
          equipment_notes: equipmentNotes
        })
        .select()
        .single();


    if (error) {

      showMessage(
        "setupMessage",
        error.message,
        "error"
      );

      return;
    }


    currentProfile = data;

    showDTR();
  }


  function showDTR() {

    showScreen("dtrScreen");

    document.getElementById("dtrDate").value =
      todayString();

    document.getElementById("crewGreeting").textContent =
      currentProfile.name +
      " · " +
      currentProfile.position;
  }


  async function submitDTR() {

    const date =
      document.getElementById("dtrDate").value;

    const startValue =
      document.getElementById("startTime").value;

    const endValue =
      document.getElementById("endTime").value;

    const lunchMinutes =
      parseInt(
        document.getElementById("lunchMinutes").value,
        10
      ) || 0;

    const notes =
      document.getElementById("dtrNotes").value.trim();


    if (!date || !startValue || !endValue) {

      showMessage(
        "dtrMessage",
        "Please enter the date, start time and end time.",
        "error"
      );

      return;
    }


    const startMinutes =
      parseTimeToMinutes(startValue);

    const endMinutes =
      parseTimeToMinutes(endValue);


    if (startMinutes === null) {

      showMessage(
        "dtrMessage",
        "Start time must be between 00:00 and 48:00.",
        "error"
      );

      return;
    }


    if (endMinutes === null) {

      showMessage(
        "dtrMessage",
        "End time must be between 00:00 and 48:00.",
        "error"
      );

      return;
    }


    if (endMinutes <= startMinutes) {

      showMessage(
        "dtrMessage",
        "End time must be later than start time. Use 25:00 instead of 01:00 for an after-midnight finish.",
        "error"
      );

      return;
    }


    if (lunchMinutes < 0) {

      showMessage(
        "dtrMessage",
        "Lunch duration cannot be negative.",
        "error"
      );

      return;
    }


    if ((endMinutes - startMinutes) < lunchMinutes) {

      showMessage(
        "dtrMessage",
        "Lunch cannot be longer than the total shift.",
        "error"
      );

      return;
    }


    const { error } =
      await supabaseClient
        .from("dtrs")
        .upsert(
          {
            crew_profile_id: currentProfile.id,
            date,
            start_minutes: startMinutes,
            lunch_minutes: lunchMinutes,
            end_minutes: endMinutes,
            notes,
            status: "submitted",
            updated_at: new Date().toISOString()
          },
          {
            onConflict: "crew_profile_id,date"
          }
        );


    if (error) {

      showMessage(
        "dtrMessage",
        error.message,
        "error"
      );

      return;
    }


    showMessage(
      "dtrMessage",
      "DTR submitted successfully.",
      "success"
    );
  }


  async function signOut() {

    await supabaseClient.auth.signOut();

    currentUser = null;
    currentProfile = null;
    productionId = null;

    showScreen("loginScreen");
  }


  initialize();

</script>

</body>
</html>
