<body>

<div class="container">

  <!-- LOGIN SCREEN -->
  <div id="loginScreen">

    <h1>Age of Attraction</h1>

    <div class="subtitle">
      Season 2 · Sound Department
    </div>

    <label>Email</label>
    <input
      id="email"
      type="email"
      autocomplete="email"
      placeholder="Email"
    >

    <label>Password</label>
    <input
      id="password"
      type="password"
      autocomplete="current-password"
      placeholder="Password"
    >

    <button onclick="signIn()">
      Log In
    </button>

    <button class="secondary" onclick="signUp()">
      Create Account
    </button>

    <div id="loginMessage"></div>

  </div>


  <!-- CREW SETUP SCREEN -->
  <div id="setupScreen" class="hidden">

    <h1>Welcome</h1>

    <div class="subtitle">
      Let's set up your sound department profile.
    </div>

    <label>Name</label>

    <input
      id="crewName"
      type="text"
      placeholder="Full name"
      autocomplete="name"
    >


    <label>Position</label>

    <select id="position">

      <option value="">
        Select position
      </option>

      <option value="HOD">
        HOD
      </option>

      <option value="A1">
        A1
      </option>

      <option value="A2">
        A2
      </option>

      <option value="Bag Mixer">
        Bag Mixer
      </option>

    </select>


    <label>Day Rate</label>

    <input
      id="dayRate"
      type="number"
      step="0.01"
      placeholder="650.00"
      inputmode="decimal"
    >


    <label>Kit Rental</label>

    <input
      id="kitRental"
      type="number"
      step="0.01"
      placeholder="350.00"
      inputmode="decimal"
    >


    <label>Kit / Equipment Notes</label>

    <textarea
      id="equipmentNotes"
      placeholder="Optional equipment information"
    ></textarea>


    <button onclick="saveProfile()">
      Save Profile
    </button>

    <div id="setupMessage"></div>

  </div>


  <!-- DAILY DTR SCREEN -->
  <div id="dtrScreen" class="hidden">

    <h1>Daily DTR</h1>

    <div class="subtitle">
      Age of Attraction · Season 2
    </div>


    <div class="card">

      <strong id="crewDisplayName"></strong>

      <div id="crewDisplayPosition"></div>

    </div>


    <label>Date</label>

    <input
      id="dtrDate"
      type="date"
    >


    <label>Start Time</label>

    <input
      id="startTime"
      type="time"
    >

    <select id="lunchMinutes">

      <option value="0">
        No lunch

      <option value="30">
        30 minutes

        45 minutes
      </option>

      <option value="60">
        1 hour
      </option>

      <option value="75">

      </option>

      <option value="90">
        1 hour 30 minutes
      </option>

    </select>


    <label>End Time</label>

    <input
      id="endTime"
      type="time"
    >


    <label>Notes</label>

    <textarea
      id="dtrNotes"
      placeholder="Optional notes"
    ></textarea>


    <button onclick="submitDTR()">
      Submit DTR
    </button>


    <button
      class="secondary"
      onclick="signOut()"
    >
      Log Out
    </button>


    <div id="dtrMessage"></div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://hyhzcikkoqvvfyiffmla.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Gl1oRE_S8bRTiI65vCnHRQ_InR0_wX1";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentUser = null;
let currentProfile = null;


/* ==========================
   STARTUP
========================== */

async function initialize() {

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();


  if (session) {

    currentUser = session.user;

    await loadProfile();

  }

}


/* ==========================
   SIGN UP
========================== */

async function signUp() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();


  const password =
    document
      .getElementById("password")
      .value;


  if (!email || !password) {

    showLoginMessage(
      "Please enter an email and password."
    );

    return;

  }


  const { error } =
    await supabaseClient.auth.signUp({

      email: email,

      password: password

    });


  if (error) {

    showLoginMessage(
      error.message
    );

    return;

  }


  showLoginMessage(
    "Account created. You can now log in."
  );

}


/* ==========================
   LOGIN
========================== */

async function signIn() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();


  const password =
    document
      .getElementById("password")
      .value;


  if (!email || !password) {

    showLoginMessage(
      "Please enter your email and password."
    );

    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });


  if (error) {

    showLoginMessage(
      error.message
    );

    return;

  }


  currentUser = data.user;

  await loadProfile();

}


/* ==========================
   LOAD PROFILE
========================== */

async function loadProfile() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("crew_profiles")
      .select("*")
      .eq("user_id", currentUser.id)
      .maybeSingle();


  if (error) {

    console.error(error);

    showLoginMessage(
      "Unable to load your profile."
    );

    return;

  }


  if (!data) {

    showSetup();

  } else {

    currentProfile = data;

    showDTR();

  }

}


/* ==========================
   SAVE PROFILE
========================== */

async function saveProfile() {

  const name =
    document
      .getElementById("crewName")
      .value
      .trim();


  const position =
    document
      .getElementById("position")
      .value;


  const dayRate =
    parseFloat(
      document
        .getElementById("dayRate")
        .value
    ) || 0;


  const kitRental =
    parseFloat(
      document
        .getElementById("kitRental")
        .value
    ) || 0;


  const equipmentNotes =
    document
      .getElementById("equipmentNotes")
      .value
      .trim();


  if (!name || !position) {

    showSetupMessage(
      "Please enter your name and position."
    );

    return;

  }


  /* Find production */

  const {
    data: production,
    error: productionError
  } =
    await supabaseClient
      .from("productions")
      .select("id")
      .eq("name", "Age of Attraction")
      .eq("season", "Season 2")
      .single();


  if (productionError) {

    console.error(productionError);

    showSetupMessage(
      "Unable to find the production."
    );

    return;

  }


  /* Save profile */

  const {
    data,
    error
  } =
    await supabaseClient
      .from("crew_profiles")
      .insert({

        user_id:
          currentUser.id,

        production_id:
          production.id,

        name:
          name,

        position:
          position,

        day_rate:
          dayRate,

        kit_rental:
          kitRental,

        equipment_notes:
          equipmentNotes

      })
      .select()
      .single();


  if (error) {

    console.error(error);

    showSetupMessage(
      error.message
    );

    return;

  }


  currentProfile = data;

  showDTR();

}


/* ==========================
   SHOW SETUP
========================== */

function showSetup() {

  document
    .getElementById("loginScreen")
    .classList.add("hidden");


  document
    .getElementById("setupScreen")
    .classList.remove("hidden");


  document
    .getElementById("dtrScreen")
    .classList.add("hidden");

}


/* ==========================
   SHOW DTR
========================== */

function showDTR() {

  document
    .getElementById("loginScreen")
    .classList.add("hidden");


  document
    .getElementById("setupScreen")
    .classList.add("hidden");


  document
    .getElementById("dtrScreen")
    .classList.remove("hidden");


  document
    .getElementById("crewDisplayName")
    .textContent =
      currentProfile.name;


  document
    .getElementById("crewDisplayPosition")
    .textContent =
      currentProfile.position;


  /* Default date to today */

  const today =
    new Date()
      .toISOString()
      .split("T")[0];


  document
    .getElementById("dtrDate")
    .value =
      today;

}


/* ==========================
   SUBMIT DTR
========================== */

async function submitDTR() {

  const date =
    document
      .getElementById("dtrDate")
      .value;


  const start =
    document
      .getElementById("startTime")
      .value;


  const lunch =
    parseInt(
      document
        .getElementById("lunchMinutes")
        .value
    );


  const end =
    document
      .getElementById("endTime")
      .value;


  const notes =
    document
      .getElementById("dtrNotes")
      .value
      .trim();


  if (!date || !start || !end) {

    showDTRMessage(
      "Please enter the date, start time and end time."
    );

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("dtrs")
      .insert({

        crew_profile_id:
          currentProfile.id,

        date:
          date,

        start_time:
          start,

        lunch_minutes:
          lunch,

        end_time:
          end,

        notes:
          notes

      });


  if (error) {

    console.error(error);

    showDTRMessage(
      error.message
    );

    return;

  }


  showDTRMessage(
    "DTR submitted successfully.",
    true
  );

}


/* ==========================
   LOG OUT
========================== */

async function signOut() {

  await supabaseClient.auth.signOut();

  location.reload();

}


/* ==========================
   MESSAGES
========================== */

function showLoginMessage(message) {

  document
    .getElementById("loginMessage")
    .textContent =
      message;

}


function showSetupMessage(message) {

  document
    .getElementById("setupMessage")
    .textContent =
      message;

}


function showDTRMessage(
  message,
  success = false
) {

  const element =
    document
      .getElementById("dtrMessage");


  element.textContent =
    message;


  element.className =
    success ? "success" : "";

}


/* ==========================
   START APPLICATION
========================== */

initialize();

</script>

</body>
</html>
