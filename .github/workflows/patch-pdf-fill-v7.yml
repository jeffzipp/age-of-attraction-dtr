name: Patch PDF fill v7

on:
  push:
    branches: [main]
    paths:
      - 'pdf-fill-v7-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Safari-compatible PDF field filling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          pattern = re.compile(r'''        if \(\n          field instanceof\n          PDFLib\.PDFCheckBox\n        \) \{.*?        console\.warn\(\n          "Unhandled PDF field:",\n          fieldName\n        \);''', re.S)

          replacement = '''        // Safari/CDN-safe field detection: use the field's capabilities,
        // not constructor.name or instanceof.
        if (typeof field.setText === "function") {
          field.setText(String(value ?? ""));
          fieldsFilled++;
          continue;
        }

        if (
          typeof field.check === "function" &&
          typeof field.uncheck === "function"
        ) {
          if (value === true) {
            field.check();
          } else {
            field.uncheck();
          }
          fieldsFilled++;
          continue;
        }

        if (typeof field.select === "function") {
          field.select(String(value ?? ""));
          fieldsFilled++;
          continue;
        }

        console.warn(
          "Unhandled PDF field:",
          fieldName
        );'''

          new, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'Expected to patch 1 PDF fill block, patched {n}')

          new = new.replace(
              'V6 FIX: instanceof instead of constructor.name',
              'V7 FIX: capability-based field detection for Safari'
          )
          p.write_text(new)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix PDF form filling in Safari" || exit 0
          git push
