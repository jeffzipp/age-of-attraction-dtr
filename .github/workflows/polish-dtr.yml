name: Polish DTR app
on:
  push:
    branches: [main]
    paths: ['polish-dtr-trigger.txt']
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()

          # Safari-safe PDF field filling.
          pattern=re.compile(r'''        if \(\n          field instanceof\n          PDFLib\.PDFCheckBox\n        \) \{.*?        console\.warn\(\n          "Unhandled PDF field:",\n          fieldName\n        \);''', re.S)
          replacement='''        // Safari-safe: identify PDF fields by supported methods.
        if (typeof field.setText === "function") {
          field.setText(String(value ?? ""));
          fieldsFilled++;
          continue;
        }

        if (typeof field.check === "function" && typeof field.uncheck === "function") {
          value === true ? field.check() : field.uncheck();
          fieldsFilled++;
          continue;
        }

        if (typeof field.select === "function") {
          field.select(String(value ?? ""));
          fieldsFilled++;
          continue;
        }

        console.warn("Unhandled PDF field:", fieldName);'''
          s,n=pattern.subn(replacement,s,count=1)
          if n != 1 and 'Safari-safe: identify PDF fields by supported methods.' not in s:
              raise SystemExit(f'PDF block patch failed: {n}')

          # Remove successful diagnostic banner; keep real errors visible.
          diag=re.compile(r'''    /\* DIAGNOSTIC \*/.*?    showMessage\(\n      "timesheetMessage",\n      diagnostic,\n      fieldsFilled > 0\n        \? "success"\n        : "error"\n    \);\n''', re.S)
          s,n2=diag.subn('''    // PDF built successfully. Diagnostics remain in the console only.
    console.log("Timesheet built", {
      mappingsLoaded,
      pdfFieldsFound,
      valuesAvailable,
      fieldsFilled,
      dtrCount: dtrs ? dtrs.length : 0,
      fillErrors
    });
''',s,count=1)
          if n2 != 1 and 'PDF built successfully. Diagnostics remain in the console only.' not in s:
              raise SystemExit(f'Diagnostic patch failed: {n2}')

          # Load an existing DTR whenever the user chooses a date, allowing review/edit/resubmit.
          anchor='''async function submitDTR() {'''
          loader='''async function loadDTRForSelectedDate() {

  if (!currentProfile) return;

  const date = document.getElementById("dtrDate").value;
  if (!date) return;

  clearMessage("dtrMessage");

  const { data, error } = await supabaseClient
    .from("dtrs")
    .select("*")
    .eq("crew_profile_id", currentProfile.id)
    .eq("date", date)
    .limit(1);

  if (error) {
    showMessage("dtrMessage", error.message || "Unable to load DTR.", "error");
    return;
  }

  const dtr = data && data.length ? data[0] : null;

  if (!dtr) {
    document.getElementById("startTime").value = "";
    document.getElementById("lunchStart").value = "";
    document.getElementById("lunchEnd").value = "";
    document.getElementById("endTime").value = "";
    document.getElementById("noLunch").checked = false;
    document.getElementById("dtrNotes").value = "";
    toggleLunch();
    updateHoursPreview();
    return;
  }

  document.getElementById("startTime").value = minutesToTime(dtr.start_minutes);
  document.getElementById("endTime").value = minutesToTime(dtr.end_minutes);
  document.getElementById("noLunch").checked = !!dtr.no_lunch;
  document.getElementById("lunchStart").value = dtr.no_lunch ? "" : minutesToTime(dtr.lunch_start_minutes);
  document.getElementById("lunchEnd").value = dtr.no_lunch ? "" : minutesToTime(dtr.lunch_end_minutes);
  document.getElementById("dtrNotes").value = dtr.notes || "";

  toggleLunch();
  updateHoursPreview();

  showMessage("dtrMessage", "Existing DTR loaded. Make any changes and submit again to update it.", "success");
}

'''
          if 'async function loadDTRForSelectedDate()' not in s:
              s=s.replace(anchor,loader+anchor,1)

          # Date picker invokes existing-DTR loader.
          s=s.replace('<input type="date" id="dtrDate">','<input type="date" id="dtrDate" onchange="loadDTRForSelectedDate()">',1)

          # When returning to DTR screen, populate selected day's saved DTR.
          old='''  document.getElementById("crewGreeting").textContent =
    currentProfile.name +
    " · " +
    currentProfile.position;
}'''
          new='''  document.getElementById("crewGreeting").textContent =
    currentProfile.name +
    " · " +
    currentProfile.position;

  loadDTRForSelectedDate();
}'''
          if 'loadDTRForSelectedDate();\n}' not in s:
              s=s.replace(old,new,1)

          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Polish timesheet and add DTR editing" || exit 0
          git push
